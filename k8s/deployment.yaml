apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie-search-app
  labels:
    app: movie-search-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: movie-search-app
  template:
    metadata:
      labels:
        app: movie-search-app
    spec:
      containers:
        - name: movie-search-app
          image: movie-search-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: movie-search-app
spec:
  selector:
    app: movie-search-app
  type: NodePort
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30082
